services:
  - type: web
    name: pluvite-alertas-api
    runtime: python
    plan: free
    rootDir: web/app/python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        value: https://qhughmeaxbyupuglpvud.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ORIGENS
        value: https://pluvite.vercel.app
      - key: MONITOR_ATIVO
        value: "false"
      - key: OPENWEATHER_KEY
        sync: false
      - key: WHATSAPP_PROVEDOR
        value: "qr-poll"
      - key: CHATBOT_TOKEN
        sync: false
      - key: CHATBOT_INTERVALO_SEGUNDOS
        value: "5"

  - type: web
    name: pluvite-backend
    runtime: node
    plan: free
    rootDir: web/app/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      # Opcional: outra pasta com grafos. Sem ela, o backend usa as cópias comprimidas versionadas
      # em web/app/backend/grafos/*.json.gz (dentro do rootDir, que é tudo o que o Render enxerga).
      - key: ROTAS_DIR
        sync: false
